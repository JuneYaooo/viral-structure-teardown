<text x="906" y="353" font-size="13.5" fill="#2E2650">「别再跟风买网红锅了」</text>
<rect x="526" y="374" width="696" height="40" rx="10" fill="#FFF1D4" fill-opacity=".55"/>
<rect x="536" y="382" width="58" height="24" rx="12" fill="#EEA21F"/><text x="565" y="398.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">留人</text>
<text x="622" y="399" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#3E365A">00:07.0–00:33.0</text>
<text x="774" y="399" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#3E365A">26.0s</text>
<text x="836" y="399" font-size="14" font-weight="800" fill="#9A6300">44.8%</text>
<text x="906" y="399" font-size="13.5" fill="#2E2650">「先说我的三个测试标准」</text>
<rect x="526" y="420" width="696" height="40" rx="10" fill="#EDE7FF" fill-opacity=".55"/>
<rect x="536" y="428" width="58" height="24" rx="12" fill="#7553E6"/><text x="565" y="444.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">转折</text>
<text x="622" y="445" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#3E365A">00:33.0–00:45.0</text>
<text x="774" y="445" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#3E365A">12.0s</text>
<text x="836" y="445" font-size="14" font-weight="800" fill="#5F3FCC">20.7%</text>
<text x="906" y="445" font-size="13.5" fill="#2E2650">「卖得最贵的那口，三项全部垫底」</text>
<rect x="526" y="466" width="696" height="40" rx="10" fill="#DFF6EE" fill-opacity=".55"/>
<rect x="536" y="474" width="58" height="24" rx="12" fill="#14A077"/><text x="565" y="490.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">转化</text>
