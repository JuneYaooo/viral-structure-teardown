<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="t d">
  <title id="t">V2 评测摘要：同一输入 v0.2.0 对 v0.3.0</title>
  <desc id="d">7 个针对本轮问题的用例，v0.2.0 通过 0 个，v0.3.0 通过 7 个；真实 Whisper 转写稿句块最长从 23 秒降到 6 秒，VTT 从被当纯文本到正确解析</desc>
  <rect width="1440" height="560" fill="#17151F"/>
  <rect x="0" y="544" width="1440" height="16" fill="#6C4BB8"/>
  <text x="96" y="76" fill="#9FE3C0" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">EVALS V2 · 2026-11-02 · SAME INPUTS · v0.2.0 (git 266ad86) vs v0.3.0 · MODEL_ONLY JUDGING</text>
  <text x="96" y="150" fill="#FFFFFF" font-family="Arial, 'PingFang SC', sans-serif" font-size="56" font-weight="800">本轮 7 个用例：v0.2.0 通过 0 → v0.3.0 通过 7</text>
  <text x="96" y="196" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="22">用例专为本轮修复的问题设计，基线失败在预期内；V1 的 9 个用例在 v0.3.0 下全部复现</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(96 236)">
      <rect width="400" height="270" rx="8" fill="#2A2638"/>
      <text x="24" y="40" fill="#F0C94B" font-size="17" font-weight="700">真实 Whisper 输出（CC BY-SA 音频 90s）</text>
      <text x="24" y="84" fill="#E8A9A0" font-size="18">v0.2.0 SRT：5 块，最长 23.0s</text>
      <text x="24" y="116" fill="#9FE3C0" font-size="18">v0.3.0 SRT：17 块，最长 6.0s</text>
      <text x="24" y="160" fill="#E8A9A0" font-size="18">v0.2.0 VTT：当纯文本，正文混入时间码</text>
      <text x="24" y="192" fill="#9FE3C0" font-size="18">v0.3.0 VTT：31 条字幕 → 17 块</text>
      <text x="24" y="240" fill="#8A8F8B" font-size="15">只验证解析层；朗读体，不是爆款口播</text>
    </g>
    <g transform="translate(520 236)">
      <rect width="400" height="270" rx="8" fill="#2A2638"/>
      <text x="24" y="40" fill="#F0C94B" font-size="17" font-weight="700">合成夹具（同一输入）</text>
      <text x="24" y="84" fill="#D6D4CB" font-size="17">Netflix 式稀疏标点：最长块 24.6s → 5.9s</text>
      <text x="24" y="114" fill="#D6D4CB" font-size="17">　边界错位 6 → 0，例句 2/4 → 4/4</text>
      <text x="24" y="150" fill="#D6D4CB" font-size="17">同条多句：0 时长块 8 → 0</text>
      <text x="24" y="186" fill="#D6D4CB" font-size="17">90s 落点：四段窗口重叠 → 首尾相接</text>
      <text x="24" y="216" fill="#D6D4CB" font-size="17">　钩子 0–13.1s → 0–6.5s（绝对秒封顶）</text>
      <text x="24" y="250" fill="#D6D4CB" font-size="17">两份标注：kappa 0.896 · WindowDiff 0.154</text>
    </g>
    <g transform="translate(944 236)">
      <rect width="400" height="270" rx="8" fill="#6C4BB8"/>
      <text x="24" y="40" fill="#E6DEF7" font-size="17" font-weight="700">证据与限制</text>
      <text x="24" y="80" fill="#FFFFFF" font-size="17">judgments_v2.jsonl → summary_v2.json</text>
      <text x="24" y="110" fill="#FFFFFF" font-size="17">runs_v2/ 与 runs_v2/before_v0.2.0/</text>
      <text x="24" y="140" fill="#FFFFFF" font-size="17">run_v2.py 连跑两次 sha256 一致</text>
      <text x="24" y="186" fill="#E6DEF7" font-size="16">模板仍是 1–2 张合成卡（冷启动）</text>
      <text x="24" y="214" fill="#E6DEF7" font-size="16">第二份标注非盲标；未经人工复核</text>
      <text x="24" y="242" fill="#E6DEF7" font-size="16">单元测试 90 项通过（不代表质量）</text>
    </g>
  </g>
</svg>
