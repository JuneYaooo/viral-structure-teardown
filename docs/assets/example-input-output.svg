<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
<title id="t">拆解效果</title>
<desc id="d">左侧为 58 秒好物测评口播的 11 个字幕句块，右侧为脚本生成的拆解卡节选：四段时间轴、占比、例句和校验结果，以及套到 90 秒新脚本的落点。</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF7F1"/><stop offset="0.5" stop-color="#FAF5FF"/><stop offset="1" stop-color="#EEF4FF"/>
  </linearGradient>
  <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF8A6B" stop-opacity=".30"/><stop offset="1" stop-color="#FF8A6B" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9C7BFF" stop-opacity=".28"/><stop offset="1" stop-color="#9C7BFF" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#3A2C66" fill-opacity=".06"/></pattern>
  <linearGradient id="hookG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8577"/><stop offset="1" stop-color="#F0533F"/></linearGradient>
  <linearGradient id="buildG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCB63"/><stop offset="1" stop-color="#EEA21F"/></linearGradient>
  <linearGradient id="twistG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A58CFF"/><stop offset="1" stop-color="#7553E6"/></linearGradient>
  <linearGradient id="ctaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43D3A6"/><stop offset="1" stop-color="#14A077"/></linearGradient>
  <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B5B"/><stop offset=".33" stop-color="#F5B53D"/><stop offset=".66" stop-color="#8B6CF0"/><stop offset="1" stop-color="#22B58A"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2B1E55" flood-opacity=".07"/>
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2B1E55" flood-opacity=".12"/>
  </filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2B1E55" flood-opacity=".16"/>
  </filter>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#9A8CC4"/></marker>
</defs>
<rect width="1280" height="760" fill="url(#bg)"/>
<circle cx="1180" cy="40" r="300" fill="url(#g1)"/><circle cx="80" cy="760" r="320" fill="url(#g2)"/>
<rect width="1280" height="760" fill="url(#dots)"/><rect width="1280" height="5" fill="url(#belt)"/>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<text x="40" y="74" font-size="32" font-weight="800" fill="#1F1835">一条 58 秒测评口播，拆完是这样</text>
<text x="40" y="108" font-size="16" fill="#6E6390">左边是输入的字幕句块，右边是脚本生成的拆解卡节选。数字逐字摘自仓库里的真实运行产物，示例稿为合成样本。</text>
<g filter="url(#sh)"><rect x="40" y="140" width="420" height="580" rx="22" fill="#211B36"/></g>
<rect x="40" y="140" width="420" height="52" rx="22" fill="#2B2445"/><rect x="40" y="170" width="420" height="22" fill="#2B2445"/>
<circle cx="64" cy="166" r="6" fill="#FF5F57"/>
<circle cx="84" cy="166" r="6" fill="#FEBC2E"/>
<circle cx="104" cy="166" r="6" fill="#28C840"/>
<text x="132" y="171" font-size="14" font-weight="700" fill="#E9E4FA">字幕句块</text><text x="440" y="171" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9C93C0">11 块 · 58.0s</text>
<rect x="56" y="212" width="4" height="34" rx="2" fill="#F0533F"/>
<text x="70" y="226" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#0  00.0–04.0s</text>
<text x="70" y="244" font-size="13" fill="#E9E4FA">别再跟风买网红锅了，我自费五千块，把全平台销量前…</text>
<rect x="56" y="257" width="4" height="34" rx="2" fill="#F0533F"/>
<text x="70" y="271" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#1  04.0–07.0s</text>
<text x="70" y="289" font-size="13" fill="#E9E4FA">测完当天，我退掉了三个还没发货的订单。</text>
<rect x="56" y="302" width="4" height="34" rx="2" fill="#EEA21F"/>
<text x="70" y="316" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#2  07.0–12.0s</text>
<text x="70" y="334" font-size="13" fill="#E9E4FA">先说我的三个测试标准，受热均匀度、涂层耐磨、还有…</text>
<rect x="56" y="347" width="4" height="34" rx="2" fill="#EEA21F"/>
<text x="70" y="361" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#3  12.0–17.0s</text>
<text x="70" y="379" font-size="13" fill="#E9E4FA">受热均匀我用红外测温仪，锅面温差超过十五度的直接…</text>
<rect x="56" y="392" width="4" height="34" rx="2" fill="#EEA21F"/>
<text x="70" y="406" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#4  17.0–22.0s</text>
<text x="70" y="424" font-size="13" fill="#E9E4FA">涂层耐磨用钢丝球定量擦两百下，称重看掉了多少毫克。</text>
<rect x="56" y="437" width="4" height="34" rx="2" fill="#EEA21F"/>
<text x="70" y="451" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#5  22.0–27.0s</text>
<text x="70" y="469" font-size="13" fill="#E9E4FA">清洗成本更简单，煎一次蛋，看要用力擦几分钟。</text>
<rect x="56" y="482" width="4" height="34" rx="2" fill="#EEA21F"/>
<text x="70" y="496" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#6  27.0–33.0s</text>
<text x="70" y="514" font-size="13" fill="#E9E4FA">按这三条，前五名里有两口锅在第一轮就出局了。</text>
<rect x="56" y="527" width="4" height="34" rx="2" fill="#7553E6"/>
<text x="70" y="541" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#7  33.0–39.0s</text>
<text x="70" y="559" font-size="13" fill="#E9E4FA">但真正的反转在最后，卖得最贵的那口，三项全部垫底。</text>
<rect x="56" y="572" width="4" height="34" rx="2" fill="#7553E6"/>
<text x="70" y="586" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#8  39.0–45.0s</text>
<text x="70" y="604" font-size="13" fill="#E9E4FA">综合第一的，是直播间从来没上过首页的老牌子，价格…</text>
<rect x="56" y="617" width="4" height="34" rx="2" fill="#14A077"/>
<text x="70" y="631" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#9  45.0–52.0s</text>
<text x="70" y="649" font-size="13" fill="#E9E4FA">完整的测试数据表我贴在评论区置顶了，下单之前先去…</text>
<rect x="56" y="662" width="4" height="34" rx="2" fill="#14A077"/>
<text x="70" y="676" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F86B3">#10  52.0–58.0s</text>
<text x="70" y="694" font-size="13" fill="#E9E4FA">关注我，下期把这五口锅拿去炒糖色，看谁的涂层先阵…</text>
<g transform="translate(484 430)" filter="url(#sh2)"><circle r="24" fill="#fff"/><path d="M-8 -9 L4 0 L-8 9" fill="none" stroke="#7553E6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g filter="url(#sh)"><rect x="508" y="140" width="732" height="580" rx="22" fill="#fff"/></g>
<text x="536" y="184" font-size="20" font-weight="800" fill="#1F1835">拆解卡：网红锅五款横评</text>
<text x="536" y="210" font-size="13.5" fill="#8C82A6">好物测评 · 全长 58.0s · 句块 11 个 · 标注 4 段 · 钩子→留人→转折→转化</text>
